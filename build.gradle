plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.0.0'
description = 'Quora Application Backend'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ============================================================================
    // Spring Boot Web & Core
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ============================================================================
    // Spring Boot Data & Persistence
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ============================================================================
    // Redis Cache Configuration
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'redis.clients:jedis:5.0.1'

    // ============================================================================
    // Spring Cache Abstraction (for @Cacheable, @CacheEvict)
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // ============================================================================
    // Security & Authentication
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ============================================================================
    // JWT (JJWT) - ALL THREE REQUIRED FOR WORKING JWT
    // ============================================================================
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // ============================================================================
    // Kafka Event Streaming
    // ============================================================================
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients:3.6.0'

    // ============================================================================
    // Database
    // ============================================================================
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // ============================================================================
    // JSON Processing
    // ============================================================================
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ============================================================================
    // Validation & Input Sanitization
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'



    // ============================================================================
    // Monitoring & Observability
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ============================================================================
    // Logging
    // ============================================================================
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    // ============================================================================
    // Utilities & Helpers
    // ============================================================================
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.11.0'

    // ============================================================================
    // Lombok (Code Generation for POJO boilerplate)
    // ============================================================================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ============================================================================
    // API Documentation (Swagger/OpenAPI)
    // ============================================================================
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    // ============================================================================
    // Development Tools
    // ============================================================================
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ============================================================================
    // Testing Dependencies
    // ============================================================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.mockito:mockito-core:5.2.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ============================================================================
// Build Configuration
// ============================================================================

bootRun {
    args = ['--spring.profiles.active=dev']
}

jar {
    enabled = false
}

bootJar {
    archiveBaseName = 'quora-app'
    archiveVersion = '1.0.0'
}

